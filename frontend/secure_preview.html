{% extends "base.html" %}

{% block content %}
<!-- Anti-copy/print/screenshot CSS -->
<style>
    /* Disable all selection and drag */
    #secure-preview-zone {
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        -webkit-touch-callout: none !important;
        pointer-events: auto;
    }
    #secure-preview-zone * {
        user-select: none !important;
        -webkit-user-drag: none !important;
    }

    /* Blur when tab is not focused (anti screen-recorder) */
    body.tab-hidden #secure-preview-zone {
        filter: blur(30px) !important;
        transition: filter 0.15s ease;
    }
    body:not(.tab-hidden) #secure-preview-zone {
        filter: none;
        transition: filter 0.5s ease 0.3s;
    }

    /* Watermark overlay */
    .watermark-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        overflow: hidden;
        opacity: 0.06;
    }
    .watermark-overlay span {
        position: absolute;
        font-size: 1.2rem;
        font-weight: 900;
        color: var(--text-primary);
        white-space: nowrap;
        transform: rotate(-35deg);
        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    /* Block print via CSS */
    @media print {
        body * { display: none !important; }
        body::after {
            content: "🔒 Printing is disabled for secure previews.";
            display: block !important;
            font-size: 2rem;
            text-align: center;
            padding: 4rem;
            color: #333;
        }
    }

    /* PDF page canvas styling */
    .pdf-page-canvas {
        display: block;
        margin: 0 auto 1rem auto;
        max-width: 100%;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        border-radius: 4px;
    }
    .pdf-page-num {
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 1.5rem;
        font-weight: 600;
    }
</style>

<div style="max-width: 900px; margin: 0 auto; padding-top: 2rem;">
    <div class="auth-card" style="max-width: 100%; border-radius: var(--radius-md); text-align: center;">
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Secure Preview: {{ file.filename }}</h2>
        <p style="color: var(--accent-danger); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem;">
            ⚠️ One-time view only. Download, print, and copy are disabled.
        </p>
        <p style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 1.5rem;">
            🔒 Content is watermarked and protected. The preview will blur if you switch tabs.
        </p>

        <div id="secure-preview-zone" style="position: relative; background: var(--bg-base); padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-card); overflow: auto; max-height: 700px; min-height: 200px;"
             oncontextmenu="return false;"
             ondragstart="return false;"
             onselectstart="return false;"
             oncopy="return false;"
             oncut="return false;">

            <!-- Watermark (generated by JS) -->
            <div class="watermark-overlay" id="watermark-overlay"></div>

            <!-- Content area -->
            <div id="preview-content" style="position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; width: 100%;">
                <div id="preview-loading" style="color: var(--text-muted); padding: 3rem;">🔒 Decrypting secure preview...</div>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <a href="/dashboard" class="btn btn-outline">Close Preview</a>
        </div>
    </div>
</div>

<!-- PDF.js from CDN for canvas-based PDF rendering -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<script>
(function() {
    "use strict";

    // ==========================================
    // 1. BLOCK ALL KEYBOARD SHORTCUTS
    // ==========================================
    document.addEventListener('keydown', function(e) {
        // Block: Ctrl+S, Ctrl+P, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, F12, PrtScn
        const blocked = [
            e.ctrlKey && e.key === 's',
            e.ctrlKey && e.key === 'p',
            e.ctrlKey && e.key === 'u',
            e.ctrlKey && e.shiftKey && e.key === 'I',
            e.ctrlKey && e.shiftKey && e.key === 'J',
            e.ctrlKey && e.shiftKey && e.key === 'C',
            e.key === 'F12',
            e.key === 'PrintScreen',
        ];
        if (blocked.some(Boolean)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }, true);

    // Block print
    window.addEventListener('beforeprint', function(e) { e.preventDefault(); });

    // ==========================================
    // 2. BLUR ON TAB SWITCH (anti screen-recorder)
    // ==========================================
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            document.body.classList.add('tab-hidden');
        } else {
            // Small delay before unblur to defeat quick screenshotters
            setTimeout(() => document.body.classList.remove('tab-hidden'), 400);
        }
    });
    window.addEventListener('blur', () => document.body.classList.add('tab-hidden'));
    window.addEventListener('focus', () => setTimeout(() => document.body.classList.remove('tab-hidden'), 400));

    // ==========================================
    // 3. GENERATE WATERMARK TILES
    // ==========================================
    function generateWatermark() {
        const overlay = document.getElementById('watermark-overlay');
        const text = "CONFIDENTIAL — SecureShare";
        const cols = 5, rows = 12;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const span = document.createElement('span');
                span.textContent = text;
                span.style.left = (c * 22 - 5) + '%';
                span.style.top = (r * 9 - 2) + '%';
                overlay.appendChild(span);
            }
        }
    }
    generateWatermark();

    // ==========================================
    // 4. DECRYPT AND RENDER CONTENT
    // ==========================================
    document.addEventListener("DOMContentLoaded", async () => {
        const mimeType = "{{ mime_type }}";
        const base64Content = "{{ content }}";
        const contentEl = document.getElementById("preview-content");
        const loading = document.getElementById("preview-loading");

        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const keyBase64 = hashParams.get('key');

        // Strip the key from the URL so it can't be copied from address bar
        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        try {
            let decryptedBuffer;

            const base64ToUint8 = (base64) => {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return bytes;
            };

            if (keyBase64) {
                const keyBytes = base64ToUint8(keyBase64);
                const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
                const encryptedBytes = base64ToUint8(base64Content);
                const iv = encryptedBytes.slice(0, 12);
                const data = encryptedBytes.slice(12);
                decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, data);
            } else {
                decryptedBuffer = base64ToUint8(base64Content).buffer;
            }

            loading.remove();

            // ---- IMAGE ----
            if (mimeType.startsWith('image/')) {
                const blob = new Blob([decryptedBuffer], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const img = document.createElement('img');
                img.src = url;
                img.style.maxWidth = "100%";
                img.style.height = "auto";
                img.style.pointerEvents = "none";
                img.draggable = false;
                img.onload = () => URL.revokeObjectURL(url); // Revoke blob URL immediately after render
                contentEl.appendChild(img);

            // ---- PDF (Canvas rendering via PDF.js) ----
            } else if (mimeType === 'application/pdf') {
                const pdfData = new Uint8Array(decryptedBuffer);
                
                // Configure PDF.js worker
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                
                const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
                const totalPages = pdf.numPages;

                // Page navigation info
                const pageInfo = document.createElement('div');
                pageInfo.style.cssText = 'margin-bottom: 1rem; font-size: 0.8rem; color: var(--text-muted); font-weight: 600;';
                pageInfo.textContent = `📄 ${totalPages} page${totalPages > 1 ? 's' : ''}`;
                contentEl.appendChild(pageInfo);

                // Render each page as a canvas
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.maxWidth = '100%';
                    canvas.style.height = 'auto';
                    // Block saving canvas as image
                    canvas.addEventListener('contextmenu', e => e.preventDefault());
                    
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport }).promise;
                    contentEl.appendChild(canvas);

                    // Page number label
                    const label = document.createElement('div');
                    label.className = 'pdf-page-num';
                    label.textContent = `Page ${pageNum} of ${totalPages}`;
                    contentEl.appendChild(label);
                }

            // ---- TEXT ----
            } else {
                const textDecoder = new TextDecoder("utf-8");
                const text = textDecoder.decode(decryptedBuffer);
                const div = document.createElement('div');
                div.style.cssText = 'text-align: left; font-family: monospace; white-space: pre-wrap; word-wrap: break-word; font-size: 0.85rem; padding: 1rem; color: var(--text-primary);';
                div.innerText = text;
                contentEl.appendChild(div);
            }
        } catch (err) {
            console.error("Preview decryption failed:", err);
            loading.innerText = "❌ Failed to decrypt preview. The link may have expired.";
            loading.style.color = "var(--accent-danger)";
        }
    });
})();
</script>
{% endblock %}
