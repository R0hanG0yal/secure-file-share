{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" id="login-card">
        <div class="auth-header">
            <h2>Welcome back</h2>
            <p>Sign in to your secure vault</p>
        </div>
        <form method="post" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="email" name="email" required placeholder="Email address" id="login-email">
            <input type="password" name="password" required placeholder="Password" id="login-password">
            <button class="btn" type="submit" id="login-submit">Sign In</button>
        </form>
        <div class="auth-footer">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account? <a href="/register">Create one</a></p>
        </div>
    </div>
</div>
{% endblock %}
