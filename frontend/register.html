{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" id="register-card">
        <div class="auth-header">
            <h2>Get Started</h2>
            <p>Create your secure sharing account</p>
        </div>
        <form method="post" id="register-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="email" name="email" required placeholder="Email address" id="register-email">
            <input type="password" name="password" required placeholder="Create a password" id="register-password">
            <button class="btn" type="submit" id="register-submit">Create Account</button>
        </form>
        <div class="auth-footer">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
