services:
  # 1. Main DoShare Web Application (Express API + React PWA Frontend)
  - type: web
    name: doshare-app
    env: node
    plan: free
    buildCommand: cd app_client && npm install && npm run build && cd ../app_server && npm install
    startCommand: cd app_server && node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_CLASSIC_P2P_URL
        value: https://doshare-p2p.onrender.com/p2p

  # 2. Classic DoShare P2P Website (Python Flask)
  - type: web
    name: doshare-p2p
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    autoDeploy: true
